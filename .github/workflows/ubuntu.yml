name: Ubuntu
run-name: "Ubuntu ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

# see https://github.community/t5/GitHub-Actions/How-to-trigger-an-action-on-push-or-pull-request-but-not-both/m-p/35805
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', 'pypy3.10', 'pypy3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Show environment
      run: |
        uv run --python ${{ matrix.python-version }} python --version
        uv run --python ${{ matrix.python-version }} python -c "import multiprocessing as m; print('CPUs:', m.cpu_count())"

    - name: Install minisat
      run: sudo apt-get -y install minisat

    - name: Check style
      if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.14'
      run: |
        uvx ruff@0.15.2 check .
        uvx ruff@0.15.2 format --check .

    - name: Run tests
      run: uv run --python ${{ matrix.python-version }} --group dev pytest --slow pyperplan/tests
